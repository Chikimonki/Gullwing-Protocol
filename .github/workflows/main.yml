name: Gullwing Protocol Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit python3 curl

      - name: Test LuaJIT
        run: |
          luajit -v
          echo "✅ LuaJIT works"

      - name: Test core files exist
        run: |
          ls -la src/moabi-reflect.lua
          ls -la src/moabi-serve.lua
          ls -la arcade/*/game.lua
          echo "✅ Core files present"

      - name: Test reflect (basic)
        run: |
          # Fix paths for GitHub runner
          sed -i 's|/mnt/d/The-Gullwing-Protocol/CORE/gullwing-cormorant/src|./src|g' src/moabi-reflect.lua
          sed -i 's|/mnt/d/moabi/src|./src|g' src/moabi-reflect.lua
          luajit src/moabi-reflect.lua /usr/bin/ls --static-only | head -20

      - name: Test server starts
        run: |
          # Fix paths
          sed -i 's|/mnt/d/The-Gullwing-Protocol/CORE/gullwing-cormorant/src|./src|g' src/moabi-serve.lua
          sed -i 's|/mnt/d/moabi/src|./src|g' src/moabi-serve.lua
          luajit src/moabi-serve.lua &
          sleep 5
          curl http://127.0.0.1:9393/health || echo "Server not responding"
          pkill -f moabi-serve || true

      - name: Test arcade files
        run: |
          ls -la arcade/
          ls -la arcade/*/game.lua
          echo "✅ Arcade files present"

      - name: Test documentation
        run: |
          ls -la README.md
          ls -la USER-GUIDE.md 2>/dev/null || echo "User guide not found"
          head -5 README.md
          echo "✅ Documentation present"
